<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Pruebas de core.js</title>
<style>body{font:14px/1.5 system-ui,sans-serif;background:#0a1018;color:#edf4fb;max-width:820px;margin:24px auto;padding:0 16px}
.ok{color:#63d5a1}.bad{color:#ff626d;font-weight:700}h1{font-size:20px}pre{white-space:pre-wrap;color:#ffb8be}#sum{font-size:18px;margin:12px 0}</style></head>
<body>
<h1>Pruebas de la lógica (core.js)</h1>
<p>Abre esta página con el servidor en marcha: <code>http://localhost:8000/tests/pruebas.html</code>. Todo debe salir en verde. No usa internet.</p>
<div id="sum"></div><div id="out"></div>
<script src="../core.js"></script>
<script>
(() => {
  const Core = window.SismoCore;
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg || 'distinto'}: esperado ${JSON.stringify(b)}, obtenido ${JSON.stringify(a)}`); };
  const near = (a, b, tol, msg) => { if (Math.abs(a - b) > tol) throw new Error(`${msg || 'lejos'}: esperado ≈${b}, obtenido ${a}`); };
  function test(name, fn) {
    try { fn(); pass++; out.insertAdjacentHTML('beforeend', `<div class="ok">✓ ${name}</div>`); }
    catch (e) { fail++; out.insertAdjacentHTML('beforeend', `<div class="bad">✗ ${name}</div><pre>${e.message}</pre>`); }
  }

  // Tabla con el MISMO formato que publica el IGC-UP (filas copiadas de su web).
  const row = (st, d, h, lat, lon, dep, mag, reg, link = 'https://sismosgeociencias.up.ac.pa/ultimosismo.html?z=9&lt=1') =>
    `<tr><td>${st}</td><td>${d}</td><td>${h}</td><td>${lat}</td><td>${lon}</td><td>${dep}</td><td>${mag}</td><td>${reg}</td><td><a href="${link}">Ver</a></td></tr>`;
  const IGC_HTML = `<html><body><table>
    <tr><th>Estado</th><th>Fecha</th><th>Hora Local</th><th>Latitud</th><th>Longitud</th><th>Profundidad</th><th>Magnitud</th><th>Región</th><th>Mapa</th></tr>
    ${row('PRELIMINAR', '2026-10-09', '11:14:02PM', '7.58288', '-80.58581', '10km', '6.2', 'Localizado en Panamá a 25km al noroeste de Tonosí')}
    ${row('REVISADO', '2026-10-09', '11:12:39PM', '7.59900', '-80.63267', '3km', '6.2', 'Localizado en Panamá a 30km al noroeste de Tonosí')}
    ${row('PRELIMINAR', '2026-10-09', '11:10:56PM', '7.70191', '-81.69134', '10km', '4.2', 'Localizado en Panamá a 15km al norte de Coiba')}
    ${row('PRELIMINAR', '2026-10-09', '11:10:56PM', '7.70191', '-81.69134', '10km', '4.2', 'Localizado en Panamá a 15km al norte de Coiba')}
    ${row('REVISADO', '2026-10-09', 'hora rara', '1', '1', '1km', '3.0', 'basura')}
    ${row('REVISADO', '2026-10-09', '12:05:00AM', '8.1', '-82.0', '5km', '3.1', 'Localizado en Panamá a 10km al sur de David', 'javascript:alert(1)')}
  </table></body></html>`;

  const igc = Core.parseIgcRows(IGC_HTML, window.DOMParser);
  const usgsFeature = (id, mag, lat, lon, iso, place) => ({ id, geometry: { coordinates: [lon, lat, 12] }, properties: { mag, time: Date.parse(iso), updated: Date.parse(iso), place, status: 'automatic', tsunami: 0, url: 'https://earthquake.usgs.gov/earthquakes/eventpage/' + id } });

  test('IGC-UP: lee las filas válidas, ignora cabecera, basura y duplicados', () => { eq(igc.length, 4); eq(igc.map((r) => r.mag), [6.2, 6.2, 4.2, 3.1]); });
  test('IGC-UP: la hora local de Panamá (UTC-5) se convierte bien, sin importar la zona del navegador', () => {
    eq(igc[0].time.toISOString(), '2026-10-10T04:14:02.000Z');
    eq(igc[1].time.toISOString(), '2026-10-10T04:12:39.000Z');
  });
  test('IGC-UP: profundidad "10km" y región sin "Localizado en"', () => { eq(igc[0].depth, 10); eq(igc[0].place, 'Panamá a 25km al noroeste de Tonosí'); eq(igc[0].status, 'PRELIMINAR'); });
  test('IGC-UP: 12:05 AM es 00:05 (no 12:05) y 12:30 PM es 12:30', () => {
    eq(Core.normalizeTime('12:05:00AM'), '00:05:00'); eq(Core.normalizeTime('12:30:00PM'), '12:30:00');
    eq(Core.normalizeTime('9:07:01AM'), '09:07:01'); eq(Core.normalizeTime('hora rara'), null);
    eq(igc[3].time.toISOString(), '2026-10-09T05:05:00.000Z');
  });
  test('IGC-UP: un enlace "javascript:" nunca se usa como URL', () => { eq(igc[3].url, Core.IGC_PAGE_URL); });
  test('IGC-UP: el preliminar se descarta cuando existe su revisado', () => {
    const kept = Core.dropSupersededPreliminary(igc);
    eq(kept.length, 3); eq(kept.filter((r) => r.status === 'PRELIMINAR').length, 1); eq(kept.find((r) => r.mag === 6.2).status, 'REVISADO');
  });
  test('Dos revisados parecidos NO se fusionan (podrían ser dos sismos reales)', () => {
    const a = { ...igc[1] }, b = { ...igc[1], time: new Date(igc[1].time.getTime() + 40000) };
    eq(Core.dropSupersededPreliminary([a, b]).length, 2);
  });
  test('USGS: texto en inglés pasa a español', () => {
    eq(Core.placeEs('25 km NW of Tonosí, Panama'), 'a 25 km al NO de Tonosí, Panama');
    eq(Core.placeEs('Panama-Costa Rica border region'), 'Panama-Costa Rica border region');
  });

  const usgsMain = Core.usgsToReport(usgsFeature('us1', 6.3, 7.62, -80.60, '2026-10-10T04:13:10Z', '28 km NW of Tonosí, Panama'));
  const usgsFar = Core.usgsToReport(usgsFeature('us2', 3.1, 9.2, -83.0, '2026-10-10T03:00:00Z', '10 km S of Somewhere'));
  test('USGS: mismo sismo reportado por USGS e IGC-UP se muestra UNA sola vez con ambos reportes', () => {
    const ev = Core.mergeSources([usgsMain, usgsFar], igc);
    eq(ev.length, 4);  // fusionado + Coiba 4.2 + David 3.1 + USGS lejano 3.1
    const m = ev.find((e) => e.reports.length === 2);
    eq(m.reports.map((r) => r.source).sort(), ['IGC-UP', 'USGS']);
    eq(m.mag, 6.3); eq(m.lat, 7.599); // ubicación del IGC-UP revisado
    eq(m.place, 'Panamá a 30km al noroeste de Tonosí');
  });
  test('Un evento chico cercano en el tiempo NO se funde con uno grande (diferencia de magnitud)', () => {
    const small = Core.usgsToReport(usgsFeature('us3', 2.8, 7.61, -80.61, '2026-10-10T04:12:50Z', 'x'));
    const ev = Core.mergeSources([small], igc.slice(0, 2));
    eq(ev.length, 2); eq(ev.every((e) => e.reports.length === 1), true);
  });

  test('Alertas: el mismo sismo no suena dos veces, pero SÍ si su magnitud sube ≥ 0.5', () => {
    const known = [];
    const prelim = Core.buildEvent([igc[0]]);
    eq(Core.classify(prelim, known), 'new'); Core.remember(prelim, known);
    const revised = Core.buildEvent([igc[1]]);                 // 83 s de diferencia, mismo sismo
    eq(Core.classify(revised, known), 'known'); Core.remember(revised, known);
    const big = Core.buildEvent([igc[1], Core.usgsToReport(usgsFeature('us9', 7.7, 7.6, -80.6, '2026-10-10T04:13:00Z', 'x'))]);
    eq(Core.classify(big, known), 'upgraded'); Core.remember(big, known);
    eq(Core.classify(big, known), 'known');
    const later = Core.buildEvent([{ ...igc[1], time: new Date(igc[1].time.getTime() + 600000), mag: 5.0 }]);
    eq(Core.classify(later, known), 'new');                    // 10 min después: otro sismo
  });

  // ---- Réplicas ----
  const NOW = Date.parse('2026-10-10T12:00:00Z');
  const mk = (hoursAgo, mag, dLat = 0) => Core.buildEvent([{ source: 'USGS', mag, lat: 7.6 + dLat, lon: -80.6, depth: 10, time: new Date(NOW - hoursAgo * 3600000), updated: new Date(NOW), place: 'p', status: 'x', url: 'u', tsunami: false }]);
  test('Réplicas: encuentra el sismo principal y cuenta solo réplicas posteriores, cercanas y M≥3', () => {
    const evs = [mk(30, 7.7), mk(29, 5.0), mk(20, 4.0), mk(8, 3.5), mk(7, 3.2), mk(2, 3.1), mk(1.5, 2.0), mk(31, 4.0), mk(10, 4.0, 3)];
    const s = Core.findSequence(evs, NOW);
    eq(s.main.mag, 7.7); eq(s.after.length, 5);  // 5.0, 4.0, 3.5, 3.2, 3.1 (M2.0 y el previo y el lejano quedan fuera)
    eq(s.last6, 1); eq(s.prev6, 2); eq(s.trend, 'bajando'); eq(s.largest.mag, 5.0);
    eq(s.hourly.length, 24); eq(s.hourly[23 - 2], 1);
  });
  test('Réplicas: antes de 12 h no se afirma tendencia; sin sismo grande no hay panel', () => {
    eq(Core.findSequence([mk(5, 7.7), mk(1, 4.0)], NOW).trend, 'insuficiente');
    eq(Core.findSequence([mk(5, 4.9), mk(1, 4.0)], NOW), null);
  });

  document.getElementById('sum').innerHTML = fail ? `<span class="bad">${fail} fallaron</span> · ${pass} bien` : `<span class="ok">Todo bien: ${pass} pruebas</span>`;
  window.__TEST_RESULT = { pass, fail };
})();
</script></body></html>
