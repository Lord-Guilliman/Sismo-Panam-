name: Validación del proyecto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias del backend
        run: python -m pip install -r backend/requirements.txt
      - name: Validar sintaxis JavaScript
        run: |
          node --check app.js
          node --check core.js
          node --check push-client.js
          node --input-type=module --check < cloudflare_worker.js
          node tests/check_config.js
      - name: Validar sintaxis Python
        run: python -m compileall -q server.py notificador_ntfy.py backend
      - name: Ejecutar pruebas actuales
        run: |
          python tests/test_python.py
          python -m unittest discover -s backend/tests -v
